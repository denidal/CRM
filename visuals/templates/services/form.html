{% extends "base.html" %} {% block content %}
<div class="page-head">
  <div>
    <h1>Yeni Servis</h1>
    <div class="page-meta">Müşteri seçin, servis/ürün ve fiyat bilgilerini girin</div>
  </div>
  <a class="btn ghost" href="/servisler">Servis Listesi</a>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post" action="/servisler/new" class="panel" style="max-width: 760px">
  <div class="grid-2">
    <div class="field">
      <label>Müşteri *</label>
      <select name="customer_id" required>
        <option value="">— Müşteri seçin —</option>
        {% for c in customers %}
        <option value="{{ c.id }}" {% if selected_customer_id is not none and (selected_customer_id | string) == (c.id | string) %}selected{% endif %}>
          {{ c.otel_adi }}{% if c.musteri_no %} ({{ c.musteri_no }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Servis Tipi</label>
      <select name="service_type">
        <option value="internet">Internet</option>
        <option value="hotspot" selected>Hotspot</option>
        <option value="interfiber">Interfiber</option>
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="field">
      <label>Katalog Ürünü / Servis *</label>
      <select name="product_id" id="product_select" required onchange="onCatalogProductChange()">
        <option value="">— Katalogdan ürün seçin —</option>
        {% for p in products or [] %} {% set p_id = p.id if p.id is defined else '' %} {% set p_name = p.product_name if
        p.product_name is defined else (p.name if p.name is defined else p) %} {% set p_price = p.price if p.price is
        defined else 0 %}
        <option value="{{ p_id }}" data-name="{{ p_name }}" data-price="{{ p_price }}">
          {{ p_name }}{% if p.speed_or_capacity_option %} — {{ p.speed_or_capacity_option }}{% endif %}{% if p_price %}
          ({{ p_price }} TL){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Durum</label>
      <select name="durum">
        <option value="onaylandı" selected>Onaylandı</option>
        <option value="tekliflendirildi">Tekliflendirildi</option>
        <option value="kurulum">Kurulum</option>
        <option value="iptal">İptal</option>
      </select>
    </div>
  </div>

  <div class="grid-3">
    <div class="field">
      <label>Birim Fiyat (TL) *</label>
      <input name="unit_price" id="unit_price" type="number" step="0.01" min="0" required />
    </div>
    <div class="field">
      <label>Adet</label>
      <input name="quantity" id="quantity" type="number" step="1" min="1" value="1" />
    </div>
    <div class="field">
      <label>Başlangıç Tarihi</label>
      <input name="start_date" type="date" value="{{ today or '' }}" />
    </div>
  </div>

  <div class="field">
    <label>Bitiş Tarihi</label>
    <input name="end_date" type="date" />
  </div>

  <h2>Teknik Bilgiler (Opsiyonel)</h2>
  <div class="grid-2">
    <div class="field">
      <label>POP</label>
      <select name="pop_id">
        <option value="">— yok —</option>
        {% for p in pops or [] %}
        <option value="{{ p.id }}">{{ p.pop_kodu }} — {{ p.pop_adi }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>RADIUS Kullanıcı Adı</label>
      <input name="radius_username" placeholder="opsiyonel" />
    </div>
  </div>

  <div class="toolbar" style="margin-top: 1rem">
    <button class="btn green" type="submit">Kaydet</button>
    <a class="btn ghost" href="/servisler">İptal</a>
  </div>
</form>

<script>
  const CATALOG_PRICES = {{ (prices or {}) | tojson }};

  function onCatalogProductChange() {
    const select = document.getElementById('product_select');
    const priceInput = document.getElementById('unit_price');
    if (!select || !priceInput) return;

    const opt = select.options[select.selectedIndex];
    if (!opt || !opt.value) {
      priceInput.value = '';
      return;
    }

    const pName = opt.dataset.name || '';
    const pId = opt.value;

    // 1. Check saved catalog prices map (by name or id), then fallback to option's data-price
    let resolvedPrice = null;
    if (CATALOG_PRICES && Object.prototype.hasOwnProperty.call(CATALOG_PRICES, pName)) {
      resolvedPrice = CATALOG_PRICES[pName];
    } else if (CATALOG_PRICES && Object.prototype.hasOwnProperty.call(CATALOG_PRICES, pId)) {
      resolvedPrice = CATALOG_PRICES[pId];
    } else if (opt.dataset.price !== undefined && opt.dataset.price !== '') {
      resolvedPrice = opt.dataset.price;
    }

    if (resolvedPrice !== null && resolvedPrice !== undefined && resolvedPrice !== '') {
      priceInput.value = resolvedPrice;
    }
  }
</script>
{% endblock %}
