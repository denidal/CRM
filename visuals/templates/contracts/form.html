{% extends "base.html" %} {% block content %}
<style>
  form.panel,
  form.panel label,
  form.panel h2,
  form.panel h3,
  form.panel select,
  form.panel select option,
  form.panel input,
  form.panel textarea {
    color: #111827 !important;
    background-color: #ffffff !important;
  }
  .catalog-subbox {
    border: 1px solid #d1d5db;
    background: #f9fafb !important;
    border-radius: 8px;
    padding: 14px;
    margin: 12px 0 16px 0;
  }
  .price-badge {
    font-weight: 600;
    margin-top: 6px;
    font-size: 0.92rem;
  }
</style>

<div class="page-head">
  <div>
    <h1>Yeni Servis</h1>
    <div class="page-meta">Müşteri ve servis tipini seçin; katalog tarife ve fiyat alt bölümü açılacaktır</div>
  </div>
  <a class="btn ghost" href="/servisler">Servis Listesi</a>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form
  method="post"
  action="/servisler/new"
  id="service_form"
  class="panel"
  style="max-width: 780px"
  data-products="{{ (products or []) | tojson | e }}"
  data-catalog-prices="{{ (prices or {}) | tojson | e }}">
  <div class="grid-2">
    <div class="field">
      <label>Müşteri *</label>
      <select name="customer_id" id="customer_id" required>
        <option value="">— Müşteri seçin —</option>
        {% for c in customers or [] %} {% set is_selected = (selected_customer_id is not none) and
        ((selected_customer_id | string) == (c.id | string)) %}
        <option value="{{ c.id }}" {% if is_selected %} selected{% endif %}>
          {{ c.otel_adi or c.firma_unvan or c.yetkili_adi or ("Müşteri #" ~ c.id) }}{% if c.musteri_no %} ({{
          c.musteri_no }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Katalog Servis Tipi *</label>
      <select name="service_type" id="catalog_type_select" onchange="onCatalogTypeChange()" required>
        <option value="">— Tip seçin (p2p, metro, wifi) —</option>
        <option value="p2p">p2p</option>
        <option value="metro">metro</option>
        <option value="wifi">wifi</option>
      </select>
    </div>
  </div>

  <!-- Seçilen tipe göre açılan katalog alt bölümü -->
  <div id="catalog_subsection" class="catalog-subbox" style="display: none">
    <h3 style="margin-top: 0">Katalog Detayı ve Fiyatlandırma</h3>
    <div class="grid-2">
      <div class="field">
        <label>Katalog Ürünü / Tarife *</label>
        <select name="product_id" id="catalog_item_select" onchange="onCatalogItemOrTierChange()">
          <option value="">— Ürün / tarife seçin —</option>
        </select>
      </div>

      <div class="field">
        <label>Taahhüt / Fiyat Tipi *</label>
        <select name="taahhut_suresi" id="commitment_tier_select" onchange="onCatalogItemOrTierChange()">
          <option value="taahhutsuz" data-price-key="tarife">Tarife Fiyatı (Taahhütsüz)</option>
          <option value="12_ay" data-price-key="12_ay">12 Ay Taahhütlü Fiyatı</option>
          <option value="24_ay" data-price-key="24_ay">24 Ay Taahhütlü Fiyatı</option>
        </select>
      </div>
    </div>

    <div id="selected_catalog_summary" class="price-badge"></div>
  </div>

  <input type="hidden" name="product_name" id="product_name" />
  <input type="hidden" name="internet_hiz" id="internet_hiz" />

  <div class="grid-3">
    <div class="field">
      <label>Birim Fiyat (TL) *</label>
      <input name="unit_price" id="unit_price" type="number" step="0.01" min="0" required />
    </div>
    <div class="field">
      <label>Adet</label>
      <input name="quantity" id="quantity" type="number" step="1" min="1" value="1" oninput="updateTotalPreview()" />
    </div>
    <div class="field">
      <label>Başlangıç Tarihi</label>
      <input name="start_date" type="date" value="{{ today or '' }}" />
    </div>
  </div>

  <div id="line_total_preview" class="price-badge" style="margin-bottom: 12px"></div>

  <div class="grid-2">
    <div class="field">
      <label>Bitiş Tarihi</label>
      <input name="end_date" type="date" />
    </div>
    <div class="field">
      <label>Durum</label>
      <select name="durum">
        <option value="teklif">Teklif</option>
        <option value="kurulum">Kurulum</option>
        <option value="upgrade/downgrade">Upgrade / Downgrade</option>
        <option value="handover">Handover</option>
        <option value="acc_mnger_onay">Acc Mnger Onay</option>
        <option value="onaylandı" selected>Faturalanan (Aktif)</option>
        <option value="iptal">İptal</option>
        <option value="deaktif">Deaktif</option>
      </select>
    </div>
  </div>

  <h2>Lokasyon ve Teknik Bilgiler</h2>
  <div class="grid-2">
    <div class="field">
      <label>Lokasyon Adı / Kodu</label>
      <input name="lokasyon_adi" id="lokasyon_adi" placeholder="Örn: Merkez Bina / LOC-01" />
    </div>
    <div class="field">
      <label>POP</label>
      <select name="pop_id">
        <option value="">— yok —</option>
        {% for p in pops or [] %}
        <option value="{{ p.id }}">{{ p.pop_kodu }} — {{ p.pop_adi }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="field">
    <label>RADIUS Kullanıcı Adı</label>
    <input name="radius_username" placeholder="opsiyonel" />
  </div>

  <div class="toolbar" style="margin-top: 1rem">
    <button class="btn green" type="submit">Kaydet</button>
    <a class="btn ghost" href="/servisler">İptal</a>
  </div>
</form>

<script>
  const formEl = document.getElementById("service_form");
  const RAW_PRODUCTS = JSON.parse(formEl.getAttribute("data-products") || "[]");
  const RAW_PRICES = JSON.parse(formEl.getAttribute("data-catalog-prices") || "{}");

  function parseNum(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : null;
  }

  function detectType(item) {
    const raw = String(item.service_type || item.type || item.category || item.code || item.name || "").toLowerCase();
    if (raw.includes("p2p")) return "p2p";
    if (raw.includes("metro") || raw.includes("me_internet") || raw.includes("me internet")) return "metro";
    if (raw.includes("wifi")) return "wifi";
    return null;
  }

  function buildCatalogList() {
    const items = [];
    for (const p of RAW_PRODUCTS) {
      const t = detectType(p);
      if (!t) continue;
      const id = p.id ?? p.code ?? p.name;
      const name = p.name || p.paket_adi || String(id);
      const basePrice = parseNum(p.price ?? p.fiyat ?? RAW_PRICES[id] ?? RAW_PRICES[name]);
      items.push({
        id: String(id),
        type: t,
        name,
        tarifePrice: parseNum(p.price_tarife ?? p.tarife_fiyat) ?? basePrice,
        p12Price: parseNum(p.price_12 ?? p.fiyat_12) ?? basePrice,
        p24Price: parseNum(p.price_24 ?? p.fiyat_24) ?? basePrice,
      });
    }

    // Katalog fiyat sözlüğünde olup listeye girmeyen kalemler için yedek üret
    for (const [k, v] of Object.entries(RAW_PRICES)) {
      const t = detectType({ code: k, name: k });
      if (!t) continue;
      const exists = items.some((x) => x.id === String(k) || x.name === String(k));
      if (!exists) {
        const val = parseNum(v);
        items.push({
          id: String(k),
          type: t,
          name: k.replaceAll("_", " "),
          tarifePrice: val,
          p12Price: val,
          p24Price: val,
        });
      }
    }
    return items;
  }

  const CATALOG_ITEMS = buildCatalogList();

  function onCatalogTypeChange() {
    const typeVal = document.getElementById("catalog_type_select").value;
    const subBox = document.getElementById("catalog_subsection");
    const itemSel = document.getElementById("catalog_item_select");
    const summaryEl = document.getElementById("selected_catalog_summary");

    itemSel.innerHTML = '<option value="">— Ürün / tarife seçin —</option>';
    summaryEl.textContent = "";

    if (!typeVal) {
      subBox.style.display = "none";
      return;
    }

    subBox.style.display = "block";
    const matching = CATALOG_ITEMS.filter((x) => x.type === typeVal);

    for (const item of matching) {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = item.name;
      opt.dataset.itemName = item.name;
      opt.dataset.tarife = item.tarifePrice ?? "";
      opt.dataset.p12 = item.p12Price ?? "";
      opt.dataset.p24 = item.p24Price ?? "";
      itemSel.appendChild(opt);
    }

    if (matching.length > 0) {
      itemSel.selectedIndex = 1;
      onCatalogItemOrTierChange();
    }
  }

  function onCatalogItemOrTierChange() {
    const itemSel = document.getElementById("catalog_item_select");
    const tierSel = document.getElementById("commitment_tier_select");
    const nameInput = document.getElementById("product_name");
    const speedInput = document.getElementById("internet_hiz");
    const priceInput = document.getElementById("unit_price");
    const summaryEl = document.getElementById("selected_catalog_summary");

    const opt = itemSel.options[itemSel.selectedIndex];
    const tierOpt = tierSel.options[tierSel.selectedIndex];
    if (!opt || !opt.value) return;

    const itemName = opt.dataset.itemName || opt.textContent;
    const key = tierOpt ? tierOpt.dataset.priceKey : "tarife";

    const priceMap = {
      tarife: parseNum(opt.dataset.tarife),
      "12_ay": parseNum(opt.dataset.p12),
      "24_ay": parseNum(opt.dataset.p24),
    };

    const chosenPrice = priceMap[key] ?? priceMap.tarife;
    nameInput.value = itemName;
    speedInput.value = itemName;

    if (chosenPrice !== null) {
      priceInput.value = chosenPrice.toFixed(2);
    }

    summaryEl.textContent = `Seçili: ${itemName} | Tarife: ${priceMap.tarife ?? "—"} TL · 12 Ay: ${priceMap["12_ay"] ?? "—"} TL · 24 Ay: ${priceMap["24_ay"] ?? "—"} TL`;

    updateTotalPreview();
  }

  function updateTotalPreview() {
    const price = parseNum(document.getElementById("unit_price").value) || 0;
    const qty = parseNum(document.getElementById("quantity").value) || 1;
    const totalEl = document.getElementById("line_total_preview");
    totalEl.textContent = `Hesaplanan Toplam Tutar: ${(price * qty).toFixed(2)} TL`;
  }
</script>
{% endblock %}
