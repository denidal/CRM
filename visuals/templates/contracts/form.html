{% extends "base.html" %} {% block content %}
<style>
  form.panel,
  form.panel label,
  form.panel h2,
  form.panel select,
  form.panel select option,
  form.panel input,
  form.panel textarea {
    color: #111827 !important;
    background-color: #ffffff !important;
  }
</style>

<div class="page-head">
  <div>
    <h1>Yeni Servis</h1>
    <div class="page-meta">Müşteri seçin, servis/ürün ve fiyat bilgilerini girin</div>
  </div>
  <a class="btn ghost" href="/servisler">Servis Listesi</a>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form
  method="post"
  action="/servisler/new"
  id="service_form"
  class="panel"
  style="max-width: 760px"
  data-catalog-prices="{{ (prices or {}) | tojson | e }}">
  <div class="grid-2">
    <div class="field">
      <label>Müşteri *</label>
      <!-- prettier-ignore -->
      <select name="customer_id" id="customer_id" required>
        <option value="">— Müşteri seçin —</option>
        {% for c in customers or [] %}
        {% set is_selected = (selected_customer_id is not none) and ((selected_customer_id | string) == (c.id | string)) %}
        <option value="{{ c.id }}"{% if is_selected %} selected{% endif %}>
          {{ c.otel_adi or c.firma_unvan or c.yetkili_adi or ("Müşteri #" ~ c.id) }}{% if c.musteri_no %} ({{ c.musteri_no }}){% endif %}
        </option>
        {% endfor %}
    </select>
    </div>

    <div class="field">
      <label>Servis Tipi</label>
      <select name="service_type" id="service_type">
        <option value="internet">Internet</option>
        <option value="hotspot" selected>Hotspot</option>
        <option value="interfiber">Interfiber</option>
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="field">
      <label>Katalog Ürünü / Servis *</label>
      <select name="customer_id" id="customer_id" required>
        <option value="">— Müşteri seçin —</option>
        {% for c in customers or [] %} {% set is_selected = (selected_customer_id is not none) and
        ((selected_customer_id | string) == (c.id | string)) %}
        <option value="{{ c.id }}" {% if is_selected %} selected{% endif %}>
          {{ c.otel_adi or c.firma_unvan or c.yetkili_adi or ("Müşteri #" ~ c.id) }}{% if c.musteri_no %} ({{
          c.musteri_no }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Durum</label>
      <select name="durum">
        <option value="onaylandı" selected>Onaylandı</option>
        <option value="tekliflendirildi">Tekliflendirildi</option>
        <option value="kurulum">Kurulum</option>
        <option value="iptal">İptal</option>
      </select>
    </div>
  </div>

  <input type="hidden" name="product_name" id="product_name" />

  <div class="grid-3">
    <div class="field">
      <label>Birim Fiyat (TL) *</label>
      <input name="unit_price" id="unit_price" type="number" step="0.01" min="0" required />
    </div>
    <div class="field">
      <label>Adet</label>
      <input name="quantity" id="quantity" type="number" step="1" min="1" value="1" />
    </div>
    <div class="field">
      <label>Başlangıç Tarihi</label>
      <input name="start_date" type="date" value="{{ today or '' }}" />
    </div>
  </div>

  <div class="field">
    <label>Bitiş Tarihi</label>
    <input name="end_date" type="date" />
  </div>

  <h2>Teknik Bilgiler (Opsiyonel)</h2>
  <div class="grid-2">
    <div class="field">
      <label>POP</label>
      <select name="pop_id">
        <option value="">— yok —</option>
        {% for p in pops or [] %}
        <option value="{{ p.id }}">{{ p.pop_kodu }} — {{ p.pop_adi }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>RADIUS Kullanıcı Adı</label>
      <input name="radius_username" placeholder="opsiyonel" />
    </div>
  </div>

  <div class="toolbar" style="margin-top: 1rem">
    <button class="btn green" type="submit">Kaydet</button>
    <a class="btn ghost" href="/servisler">İptal</a>
  </div>
</form>

<script>
  function getCatalogPrices() {
    const form = document.getElementById("service_form");
    if (!form) return {};
    const raw = form.getAttribute("data-catalog-prices");
    if (!raw) return {};
    try {
      return JSON.parse(raw);
    } catch (_err) {
      return {};
    }
  }

  const CATALOG_PRICES = getCatalogPrices();

  function onCatalogProductChange() {
    const sel = document.getElementById("product_select");
    const nameInput = document.getElementById("product_name");
    const priceInput = document.getElementById("unit_price");
    if (!sel || !nameInput || !priceInput) return;

    const opt = sel.options[sel.selectedIndex];
    if (!opt || !opt.value) {
      nameInput.value = "";
      return;
    }

    const pName = opt.getAttribute("data-name") || "";
    const pPrice = opt.getAttribute("data-price") || "";

    nameInput.value = pName;

    if (CATALOG_PRICES && Object.prototype.hasOwnProperty.call(CATALOG_PRICES, pName)) {
      const val = CATALOG_PRICES[pName];
      if (val !== null && val !== undefined && val !== "") {
        priceInput.value = val;
        return;
      }
    }

    if (pPrice !== "") {
      priceInput.value = pPrice;
    }
  }
</script>
{% endblock %}
