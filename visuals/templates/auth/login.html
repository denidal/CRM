{% extends "base.html" %}
{% block content %}
<section class="panel login-box">
  <div class="brand" style="margin-bottom:1rem">
    <div class="logo-mark">M</div>
    <div>
      <div class="brand-title">Müşteri Takip Sistemi</div>
      <span class="brand-sub">Yönetici girişi</span>
    </div>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form onsubmit="event.preventDefault(); login();">
    <div class="field"><label>Kullanıcı adı</label><input id="username" required /></div>
    <div class="field"><label>Şifre</label><input id="password" type="password" required /></div>
    <button type="submit">Giriş yap</button>
  </form>
</section>
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (data.success && data.token) {
    localStorage.setItem('auth_token', data.token);
    window.location.href = '/';
  } else {
    alert(data.detail || 'Giriş başarısız (DB kullanıcı yoksa UI yine gezinilebilir)');
    window.location.href = '/';
  }
}
</script>
{% endblock %}
